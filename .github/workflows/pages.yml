# The name shown in the Actions tab
name: Deploy static site to GitHub Pages

# TRIGGERS: when should this workflow run?
on:
  push:
    branches: [ main ]      # every push to main
  workflow_dispatch:         # plus a manual "Run workflow" button

# PERMISSIONS: what the workflow is allowed to do
permissions:
  contents: read             # read the repo's files
  pages: write               # publish to GitHub Pages
  id-token: write            # verify the deployment is genuine

# CONCURRENCY: if two runs overlap, cancel the older one
concurrency:
  group: pages
  cancel-in-progress: true

# JOBS: the work to be done
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest   # a fresh Ubuntu machine provided by GitHub
    steps:
      - uses: actions/checkout@v4              # 1. download your repo's code
      - uses: actions/configure-pages@v5       # 2. prepare Pages settings
      - uses: actions/upload-pages-artifact@v3 # 3. package the site files
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4          # 4. publish the package
